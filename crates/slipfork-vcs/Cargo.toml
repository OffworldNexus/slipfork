[package]
name = "slipfork-vcs"
description = "RepoRootResolver, VcsWorkspace and VcsWorkspaceFactory ports with Git worktree and Jujutsu workspace adapters"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# The conformance matrix lives in `tests/critical_conformance_matrix.rs` so `tools/critical_guard.py`
# protects its assertions; it is compiled only as a module of the `critical_vcs` suite below, never
# as a standalone test target.
autotests = false

[[test]]
name = "critical_vcs"
path = "tests/critical_vcs.rs"

[dependencies]
slipfork-world = { path = "../slipfork-world" }
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true
