[package]
name = "slipfork"
description = "Slipfork CLI & Composition Root: copy-on-write dev worlds, worktree forks, and snapshot-DAG test orchestration"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
default-run = "slipfork"

[dependencies]
clap.workspace = true
hex.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
slipfork-dag = { path = "../slipfork-dag", features = ["fs"] }
slipfork-edge = { path = "../slipfork-edge" }
slipfork-engine = { path = "../slipfork-engine" }
slipfork-ospp = { path = "../slipfork-ospp" }
slipfork-snow = { path = "../slipfork-snow" }
slipfork-vcs = { path = "../slipfork-vcs" }
slipfork-world = { path = "../slipfork-world" }

[dev-dependencies]
tempfile.workspace = true
