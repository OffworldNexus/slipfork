[package]
name = "slipfork-ospp"
description = "Slipfork-owned OSPP v1 synchronous WebSocket client, tpmd-backed P-256 device keys, and streaming seed dumps"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
getrandom.workspace = true
hex.workspace = true
p256.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
slipfork-dag = { path = "../slipfork-dag" }
slipfork-snow = { path = "../slipfork-snow" }
slipfork-world = { path = "../slipfork-world" }
thiserror.workspace = true
tokio.workspace = true
tpmd-client.workspace = true
tpmd-ipc.workspace = true
tungstenite.workspace = true
webpki-roots.workspace = true
zstd.workspace = true

[dev-dependencies]
tempfile.workspace = true
# The real wire types for the in-process fake `tpmd` daemon. `tpmd-client` re-exports only the
# consumer subset, so the test-only daemon links the protocol crate at the same pinned revision.
tpmd-proto = { git = "https://github.com/OffworldNexus/tpmd", rev = "90cb2db45b3ea6bc065918f11c7e0fd23b4ce837" }
