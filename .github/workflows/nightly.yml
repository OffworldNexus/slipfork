name: Nightly

# The `nightly` component of the signed package repositories.
#
# Every night `develop` is built natively on `amd64` and `arm64`, stamped with
# the one nightly version `publish_packages.py release-stamp` computes, published
# to Cloudsmith and mirrored to Forgejo, then pruned to the newest seven
# `(date, run)` groups. `packages.yml` is this file's sibling: same artifacts,
# release versions, the `main` component, and no retention.
#
# The version is `0.1.0-0.nightly.20261121.r42.gabc1234`: the `-0.` prefix sorts
# below the release, and the encoded `(date, run)` is what retention reads.

on:
  schedule:
    # 03:17 UTC: after the release window, before the European morning.
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  stamp:
    name: the nightly version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.stamp.outputs.version }}
      base: ${{ steps.stamp.outputs.base }}
      date: ${{ steps.stamp.outputs.date }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Compute the nightly version from the run and the commit
        id: stamp
        env:
          REF: ${{ github.ref }}
          RUN_NUMBER: ${{ github.run_number }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$REF" != "refs/heads/develop" ]; then
            echo "::error::nightlies are cut from develop (this run is $REF): merge there, or dispatch this workflow on develop"
            exit 1
          fi
          # The date is pinned once here and passed to every build job, so a run
          # that crosses midnight cannot produce two different versions.
          date=$(date -u +%Y%m%d)
          base=$(uv run --no-project scripts/publish_packages.py base-version)
          version=$(uv run --no-project scripts/publish_packages.py release-stamp \
            --date "$date" --run "$RUN_NUMBER" --sha "$COMMIT_SHA")
          {
            echo "version=$version"
            echo "base=$base"
            echo "date=$date"
          } >> "$GITHUB_OUTPUT"
          echo "nightly: $version"

  build:
    name: 'nightly packages (${{ matrix.arch }})'
    needs: [stamp]
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs_on: ubuntu-24.04
          - arch: arm64
            runs_on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: nightly-${{ matrix.arch }}
      - name: Install zstd (the pacman package)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd
      # Both bundles, each measured with `check-portable-elf.sh`: the gnu bundle
      # feeds deb/rpm/pacman, the musl one feeds apk. The musl build happens in
      # Alpine because the runner has no musl toolchain.
      - name: Build the two measured bundles
        run: |
          set -euo pipefail
          scripts/build-bundle.sh --out target/package-bundle --max-glibc auto
          scripts/build-bundle.sh --out target/package-bundle-musl \
            --target "$(uname -m)-unknown-linux-musl" \
            --max-glibc auto --container rust:1.100-alpine
      # `stamp` is the publisher's own rebuild-at-this-version path, so the
      # artifact and the version it is published under come from one command.
      - name: Stamp the deb, pacman and apk packages
        env:
          VERSION: ${{ needs.stamp.outputs.version }}
          DATE: ${{ needs.stamp.outputs.date }}
          RUN_NUMBER: ${{ github.run_number }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for format in deb arch; do
            uv run --no-project scripts/publish_packages.py stamp \
              --format "$format" --bundle target/package-bundle \
              --out dist/packages --date "$DATE" --run "$RUN_NUMBER" --sha "$COMMIT_SHA"
          done
          uv run --no-project scripts/publish_packages.py stamp \
            --format apk --bundle target/package-bundle-musl \
            --out dist/packages --date "$DATE" --run "$RUN_NUMBER" --sha "$COMMIT_SHA"
      # RPM needs the stamp split into its two fields — `0.1.0` + `0.nightly.…`
      # — because `-` is the NAME-VERSION-RELEASE separator, not a legal
      # `Version` character.
      - name: Stamp the RPM package
        env:
          VERSION: ${{ needs.stamp.outputs.version }}
          BASE: ${{ needs.stamp.outputs.base }}
        run: |
          set -euo pipefail
          scripts/build-rpm.sh --version "$BASE" --release "${VERSION#"$BASE"-}" \
            --bundle target/package-bundle --out dist/packages
      - name: Build the portable archives
        run: |
          set -euo pipefail
          scripts/build-standalone.sh --bundle target/package-bundle --out dist/packages
          scripts/build-standalone.sh --bundle target/package-bundle-musl --out dist/packages
          cd dist/packages
          # Per architecture, so the two legs' checksum files never overwrite
          # each other when the publish job merges them.
          sha256sum *.deb *.rpm *.pkg.tar.zst *.apk *.tar.gz *.tar.gz.sha256 \
            > "SHA256SUMS-${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: nightly-${{ matrix.arch }}
          path: dist/packages/*
          if-no-files-found: error

  publish:
    name: 'publish to the nightly component'
    needs: [stamp, build]
    if: >-
      !cancelled() &&
      github.repository == 'offworld-nexus/slipfork' &&
      needs.stamp.result == 'success' &&
      needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: nightly-*
          path: dist/packages
          merge-multiple: true
      - name: Publish to Cloudsmith and mirror to Forgejo
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          COMPONENT: nightly
        run: |
          set -euo pipefail
          publish_format() {
            format=$1; pattern=$2
            shopt -s nullglob
            files=(dist/packages/$pattern)
            if [ "${#files[@]}" -eq 0 ]; then
              echo "::error::no $format artifact matched dist/packages/$pattern"
              exit 1
            fi
            for file in "${files[@]}"; do
              uv run --no-project scripts/publish_packages.py push \
                --format "$format" --file "$file" --component "$COMPONENT"
              uv run --no-project scripts/publish_packages.py forgejo \
                --format "$format" --file "$file" --component "$COMPONENT"
            done
          }
          publish_format deb '*.deb'
          publish_format rpm '*.rpm'
          publish_format arch '*.pkg.tar.zst'
          publish_format apk '*.apk'
      # The portable archives are what `install.sh --user` and `--nightly`
      # consume, so they ride the rolling `nightly` prerelease as well as the
      # repositories. `--clobber` makes a re-run replace them, never duplicate.
      - name: Refresh the nightly prerelease archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view nightly >/dev/null 2>&1 ||
            gh release create nightly --prerelease --target develop \
              --title "Slipfork nightly" \
              --notes "Rolling nightly build of develop. Install with: curl -fsSL https://offworldnexus.github.io/slipfork/install.sh | sh -s -- --nightly"
          gh release upload nightly dist/packages/*.tar.gz dist/packages/*.tar.gz.sha256 --clobber

  prune:
    name: keep the newest 7 nightly runs
    needs: [publish]
    if: >-
      !cancelled() &&
      github.repository == 'offworld-nexus/slipfork' &&
      needs.publish.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # Retention counts runs, not packages: one nightly ships every format for
      # both architectures under one version, so `prune` deletes whole
      # `(date, run)` groups and never splits an architecture pair.
      - name: Prune the nightlies (Cloudsmith API)
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
        run: |
          set -euo pipefail
          for format in deb rpm arch apk; do
            uv run --no-project scripts/publish_packages.py prune \
              --format "$format" --component nightly --keep 7
          done
