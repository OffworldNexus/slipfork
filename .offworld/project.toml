name = "slipfork"
tagline = "Small bird. Whole flock."
description = "Slipfork turns one Forkfile into your whole stack — container images, PostgreSQL, Redis, S3 buckets and background workers — behind one .localhost URL. It runs natively on Btrfs with crun, so there is no Docker daemon and no shared staging box."
