[workspace]
resolver = "3"
members = [
    "crates/slipfork",
    "crates/slipfork-forkfile",
    "crates/slipfork-world",
    "crates/slipfork-image",
    "crates/slipfork-ingress",
    "crates/slipfork-ospp",
    "crates/slipfork-vcs",
    "crates/slipfork-lsp",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

# Shared third-party versions land here as crates start using them; every member
# inherits them with `foo.workspace = true` so versions never drift.
[workspace.dependencies]
base64 = "0.22"
libc = "0.2"
flate2 = "1"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
tar = "0.4"
ureq = { version = "2", default-features = false, features = ["tls"] }
zstd = "0.14"
