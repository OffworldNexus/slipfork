[workspace]
resolver = "3"
members = [
  "crates/slipfork-snow",
  "crates/slipfork-dag",
  "crates/slipfork-engine",
  "crates/slipfork",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/OffworldNexus/slipfork"
rust-version = "1.88"

[workspace.dependencies]
base64 = "0.22.1"
clap = { version = "4.5.28", features = ["derive"] }
getrandom = "0.3.3"
hex = "0.4.3"
libc = "0.2.190"
serde = { version = "1.0.228", features = ["derive"] }
serde-saphyr = "2.1.1"
serde_json = "1.0.149"
sha2 = "0.10.9"
tempfile = "3.22.0"
thiserror = "2.0.17"
toml = "1.1.2"
