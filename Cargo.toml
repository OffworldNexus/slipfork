[workspace]
resolver = "3"
members = [
    "crates/slipfork",
    "crates/slipfork-forkfile",
    "crates/slipfork-world",
    "crates/slipfork-image",
    "crates/slipfork-ingress",
    "crates/slipfork-ospp",
    "crates/slipfork-vcs",
    "crates/slipfork-lsp",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

# Shared third-party versions land here as crates start using them; every member
# inherits them with `foo.workspace = true` so versions never drift.
[workspace.dependencies]
base64 = "0.22"
clap = { version = "4.6.8", features = ["derive", "wrap_help"] }
clap_complete = "4.5.61"
clap_mangen = "0.2.29"
console = "0.15"
crossterm = "0.29"
flate2 = "1"
getrandom = "0.3.3"
hex = "0.4.3"
hmac = "0.12"
http-body-util = "0.1"
indicatif = "0.17"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
md-5 = "0.10"
hpke = { version = "0.15.1", default-features = false, features = ["aes", "alloc", "hkdfsha2", "nistp"] }
httparse = "1"
libc = "0.2"
p256 = "0.14.0"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
subtle = "2"
tar = "0.4"
tempfile = "3"
thiserror = "2.0.17"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "time", "sync"] }
tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
ureq = { version = "2", default-features = false, features = ["tls"] }
url = "2.5.8"
zstd = "0.14"
