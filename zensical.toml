[project]
site_name = "slipfork"
site_url = "https://offworldnexus.github.io/slipfork/"
site_description = "Instant copy-on-write dev worlds, OpenCode worktree forks, and parallel snapshot-DAG test orchestration from snow.yml."
site_author = "Offworld Nexus"
copyright = "&copy; 2026 Offworld Nexus &middot; Apache 2.0"

repo_url = "https://github.com/OffworldNexus/slipfork"
repo_name = "OffworldNexus/slipfork"
edit_uri = "edit/develop/docs/"

docs_dir = "docs"
site_dir = "site"

nav = [
  { "Home" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { "snow.yml modes & secrets" = "snow-modes.md" },
  { "Parallel testing DAG" = "testing-dag.md" },
  { "AI agents & OpenCode" = "agents-and-opencode.md" },
  { "Blastit integration" = "blastit.md" },
  { "Reference" = [
    { "CLI" = "reference/cli.md" },
    { "Manifest & secret protocol" = "reference/manifest.md" },
  ] },
]

extra_css = ["stylesheets/extra.css"]

exclude_docs = """
/VISION.md
/design/
/decisions/
/research/
/knowledge/
/testing/
"""

[project.theme]
language = "en"
features = [
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.tabs.link",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "teal"
accent = "cyan"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "teal"
accent = "cyan"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.validation]
invalid_links = true
invalid_link_anchors = true

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
