[project]
name = "slipfork-demo"
version = "0.1.0"
description = "Slipfork demo: FastAPI + PostgreSQL + Redis + S3 + Mailpit worker"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "psycopg[binary]>=3.2",
  "redis>=5.2",
  "boto3>=1.37",
  "python-multipart>=0.0.20",
]
