<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Slipfork demo</title>
<style>
  body { font: 16px/1.6 system-ui, sans-serif; max-width: 40rem; margin: 4rem auto; padding: 0 1rem; }
  code { background: #f1f5f9; padding: .15rem .35rem; border-radius: .25rem; }
  pre { background: #0f172a; color: #e2e8f0; padding: 1rem; border-radius: .5rem; overflow: auto; }
</style>
<h1>Slipfork demo</h1>
<p>This page is the <code>front</code> service. The table below comes from the <code>api</code>
service, which reads PostgreSQL.</p>
<pre id="rows">loading…</pre>
<script>
  fetch("/api/db")
    .then((response) => response.json())
    .then((body) => { document.getElementById("rows").textContent = body.rows.map((row) => row.join("  ")).join("\n"); })
    .catch((error) => { document.getElementById("rows").textContent = "api not ready: " + error; });
</script>
</html>
