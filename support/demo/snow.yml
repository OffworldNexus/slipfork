# The `0.1.0` hands-on demo: one Python component on an internal port, one PostgreSQL 18
# cluster, one `/` ingress. `do_vm.py sync` copies this directory to `/home/slipfork/demo`.
images:
  - id: api
    context: .
    dockerfile: Dockerfile

components:
  - id: api
    image: api
    run_command: python3 /app/server.py
    envs: [app]
    internal_ports: [8000]

ingresses:
  - match: { prefix: "/" }
    target: { component: api, port: 8000 }

resources:
  pg_clusters: [{ id: psql, version: "18" }]
  pg_databases: [{ id: demo, cluster: psql }]

modes:
  all:
    envs:
      app:
        DATABASE_URL: '${{ resources::pg_databases.demo.url }}'
        PGUSER: postgres
  local:
    envs:
      app:
        DEMO_SECRET: '${{ secrets::DEMO_SECRET !! random_hex(16) }}'
        DEBUG: 'True'
