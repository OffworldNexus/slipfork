# Slipfork integration support registry (`ADR-0007`).
#
# This file is the sole source of truth for integration support claims. `slipfork-dag` embeds it
# at compile time (`SupportRegistry::embedded()`) and validates the in-record contract; the M2
# compliance tool verifies every pointer on disk, in `git`, and in CI workflows.
#
# Tiers are ordered: none < declared < exercised < field-tested < hardened. Never claim a tier
# above the evidence present in this repository. `0.1.0` ships only the entries below; M2/M3
# integrations are added by dedicated promotion plan nodes.

